<p-table [value]="rows()" [scrollable]="true" [resizableColumns] ="true" scrollHeight="400px">
  <ng-template #header>
    <tr>
      <th>Name</th>
      <th>Model</th>
      <th>Manufacturer</th>
      <th>Crew</th>
      <th>Passengers</th>
      <th>Hyperdrive Rating</th>
    </tr>
  </ng-template>

  <ng-template #body let-starship let-i="rowIndex">
    <tr>
      <td>{{ starship.name }}</td>
      <td>{{ starship.model }}</td>
      <td>{{ starship.manufacturer }}</td>
      <td>{{ starship.crew }}</td>
      <td>{{ starship.passengers }}</td>
      <td>
        {{ starship.hyperdrive_rating }}
        @if (i === rows().length - 1) {
          <span #scrollAnchor style="display:inline-block;width:1px;height:1px;"></span>
        }
      </td>
    </tr>
  </ng-template>
</p-table>
